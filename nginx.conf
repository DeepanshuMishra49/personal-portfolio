# ==============================================================================
# Production Nginx Anti-Bot, Anti-AI & Rate Limiting Configuration
# ==============================================================================

# User Agent Scraper Mapping
map $http_user_agent $bad_bot {
    default 0;
    "" 1; # Block empty User-Agent
    ~*(GPTBot|ChatGPT-User|ClaudeBot|anthropic-ai|Claude-Web|CCBot|Google-Extended|Bytespider|Applebot-Extended) 1;
    ~*(PerplexityBot|YouBot|cohere-ai|FacebookBot|Meta-ExternalAgent|Diffbot|ImagesiftBot|magpie-crawler) 1;
    ~*(AhrefsBot|SemrushBot|MJ12bot|DotBot|Scrapy|curl|Wget|Python|HttpClient|aiohttp|httpx|Playwright|Puppeteer|Selenium) 1;
}

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    listen 443 ssl http2;
    server_name yourdomain.com;

    # 1. Block Bad Bots and AI Crawlers Immediately with HTTP 403
    if ($bad_bot = 1) {
        return 403 "Forbidden: Automated scrapers and AI crawlers are strictly prohibited.";
    }

    # 2. Block Requests Missing Browser Language Headers (Except static assets)
    if ($http_accept_language = "") {
        set $test_lang "A";
    }
    if ($request_uri !~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|pdf|txt)$) {
        set $test_lang "${test_lang}B";
    }
    if ($test_lang = "AB") {
        return 403 "Forbidden: Missing browser signature.";
    }

    # 3. Universal Anti-AI & Security Response Headers
    add_header X-Robots-Tag "noindex, nofollow, noarchive, noimageindex, nosnippet, noai, noimageai" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root Directory for Static Files (Vite build output)
    root /var/www/portfolio/dist;
    index index.html;

    # General Routes with Rate Limit (30 req/min, burst=10)
    location / {
        limit_req zone=general_zone burst=10 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # API Endpoints with Strict Rate Limit (5 req/min, burst=2)
    location /api/ {
        limit_req zone=api_zone burst=2 nodelay;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket Gateway
    location /ws/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Ensure robots.txt and ai.txt are always directly reachable
    location ~ ^/(robots\.txt|ai\.txt)$ {
        allow all;
        try_files $uri =404;
    }
}
